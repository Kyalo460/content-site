version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shirlene-postgres
    environment:
      POSTGRES_DB: shirlene
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: shirlene-app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/shirlene?schema=public
      NEXTAUTH_SECRET: your-super-secret-key-min-32-chars-change-in-production
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      ADMIN_EMAIL: admin@shirlene.com
      ADMIN_PASSWORD: changeme123!
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "npx prisma migrate deploy && npm run dev"

  # Optional: LocalStack for S3 emulation
  localstack:
    image: localstack/localstack:latest
    container_name: shirlene-localstack
    environment:
      SERVICES: s3
      DEBUG: 1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    volumes:
      - localstack_data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    profiles:
      - localstack

volumes:
  postgres_data:
  localstack_data: